{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger">
        <div class="card-body">
            <h3 class="text-danger">Postni o‘chirish</h3>

            <p>
                <strong>{{ object.title }}</strong> nomli postni
                o‘chirishni xohlaysizmi?
            </p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Ha, o‘chir
                </button>
                <a href="{% url 'article_detail' object.pk %}"
                   class="btn btn-secondary">
                    Bekor qilish
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
